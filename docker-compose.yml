version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pickleball_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pickleball
      POSTGRES_PASSWORD: pickleball123
      POSTGRES_DB: pickleball_tournament
    ports:
      - '5432:5432'
    volumes:
      - pickleball_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pickleball -d pickleball_tournament']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pickleball_data:
    driver: local
